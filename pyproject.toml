description = "Python workflows for sediment entrainment thresholds and current-only remobilization analysis."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Joao Cascalho" }
]
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "matplotlib>=3.7",
  "openpyxl>=3.1",
  "scipy>=1.10"
]

[project.urls]
Repository = "https://github.com/JCascalho/sediment-mobility"
