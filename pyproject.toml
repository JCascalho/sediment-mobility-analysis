[project]
name = "sediment-mobility"
version = "1.0.0"
description = "Python routine for calculating sediment-mobility parameters from sediment samples."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Joao Cascalho" }
]
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "matplotlib>=3.7",
  "openpyxl>=3.1",
  "scipy>=1.10"
]

[project.urls]
Repository = "https://github.com/JCascalho/sediment-mobility"

